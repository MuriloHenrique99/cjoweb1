<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="">
        <p>
            <label for="nome">Nome:</label>
            <input type="text" name="nome" id="nome" size="35" maxlength="50">
        </p>
        <p>
            <label for="data">Data:</label>
            <input type="date" name="data" id="data" min="1900-01-01" max="2026-06-14">
        </p>
        <fieldset>
            <legend>Genero:</legend>
            <p>
                <input type="radio" name="genero" id="feminino" value="feminino">
                <label for="feminino">Feminino</label>
            </p>
            <p>
                <input type="radio" name="genero" id="masculino" value="masculino">
                <label for="masculino">Masculino</label>
            </p>
            <p>
                <input type="radio" name="genero" id="indefinido" value="indefinido">
                <label for="indefinido">Indefinido</label>
            </p>
        </fieldset>

        <fieldset>
            <legend>Endereço</legend>
            <p>
                <label for="rua">Digite a rua:</label>
                <input type="text" name="rua" id="rua" placeholder="digite sua rua">
            </p>
            <p>
                <label for="numero_rua">Numero da casa:</label>
                <input type="text" name="numero_rua" id="numero_rua" size="5">
            </p>
            <p>
                <label for="bairro">nome do bairro:</label>
                <input type="text" name="bairro" id="bairro">
            </p>
        </fieldset>
        <fieldset>
            <legend>Nacionalidade</legend>
            <p>
                <label for="estado">Digite o estado:</label>
                <select name="estado" id="estado">
                    <option value="0" disabled selected>Escolha um</option>
                    <option value="SC">Santa Catarina</option>
                    <option value="RS">Rio Grande do Sul</option>
                    <option value="PR">Parana</option> 
                </select>
            </p>
            <p>
                <label for="cidade">Digite a cidade:</label>
                <input type="text" name="cidade" id="cidade" size="60">
            </p>
        </fieldset>
        <p>
            <label for="email">Email:</label>
            <input type="email" name="email" id="email">
        </p>
        <p>
            <label for="telefone">Telefone:</label>
            <input type="tel" name="telefone" id="telefone" placeholder="digite seu telefone">
        </p>
        <fieldset>
            <legend>Areas de interesse</legend>
            <p>
                <input type="checkbox" name="computaria" id="computaria" value="computaria">
                <label for="computaria">Computação</label>
            </p>
            <p>
                <input type="checkbox" name="engenharia" id="engenharia" value="engenharia">
                <label for="engenharia">Engenharia</label>
            </p>
            <p>
                <input type="checkbox" name="historia" id="historia" value="historia">
                <label for="historia">Historia</label>
            </p>
        </fieldset>
        <p>
            <label for="user">Usuario:</label>
            <input type="text" name="user" id="user" size="20" maxlength="20">
        </p>
         <p>
            <label for="senha">Senha:</label>
            <input type="password" name="senha" id="senha" size="15">
        </p>
        <p>
            <input type="submit" value="Enviar dados">
            <button type="button" onclick="mensagem();">Executar função</button>
        </p>
    </form>
    <script>
        <function mensagem(){
            alert("Eai");
        }
    </script>

    </a>
</body>
</html>
