<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="">
        <fieldset>
            <legend>Estado civil</legend>
            <P>
                <input type="radio" name="estado_civil" id="casado" value="casado">
                <label for="casado">Casado</label>
            </P>
              <input type="radio" name="estado_civil" id="divorciado" value="divorciado">
                <label for="divorciado">Divorciado</label>
            </P>
              <input type="radio" name="estado_civil" id="solteiro" value="solteiro">
                <label for="solteiro">Solteiro</label>
            </P>
            </P>
              <input type="radio" name="estado_civil" id="viuvo" value="viuvo">
                <label for="viuvo">Viuvo</label>
            </P>
        </fieldset>
        <br>
        
        <hr>
        <fieldset>
                <legend>Equipamentos</legend>
                <p>
                    <input type="checkbox" name="monitor" id="monitor" value="monitor">
                    <label for="monitor">Monitor</label>
                </p>
                <p>
                    <input type="checkbox" name="impressora" id="impressora" value="impressora">
                    <label for="impressora">Impressora</label>
                </p>
                <p>
                    <input type="checkbox" name="teclado" id="teclado" value="teclado">
                    <label for="teclado">Teclado</label>
                </p>
        </fieldset>
            <p>
                <label for="busca">Busca:</label>
                <input type="search" name="busca" id="busca">
            </p>
            <p>
                <label for="cor">Cor:</label>
                <input type="color" name="cor" id="cor">
            </p>
            <p>
                <label for="mens">Mensagem:</label>
                <textarea name="mens" id="mens" rows="5" cols="20"></textarea>
            </p>
                <label for="estado">Estado:</label>
                <select name="estado" id="estado">
                    <option value="0" disabled selected>Escolha uma opçao</option>
                    <option value="ES">Espirito Santo</option>
                    <option value="MG">Minas Gerais</option>
                    <option value="RJ">Rio de Janeiro</option>
                    <option value="SP">Sao Paulo</option>
                </select>
            </p>
            <P>
                <label for="meios_transporte">Meios de transporte</label>
                <select name="meios_transporte" id="meios_transporte">
                    <optgroup label="Carros">
                        <option value="fusca">Fusca</option>
                        <option value="onix">Onix</option>
                    </optgroup>
                    <optgroup label="Motos">
                        <option value="cg 125">CG 125</option>
                        <option value="falcon">Falcon</option>
                    </optgroup>
                </select>
            </P>
            <P>
                <input type="submit" value="enviar_dados">
            </P>
    </form>
    <hr>
    <details>
        <summary>Exibir/ocultar</summary>
        <p>Pao com queijo</p>
    </details>
</body>
</html>
